# Example host secrets file (unencrypted reference).
# Copy this to <hostname>.yaml and encrypt with:
#   sops secrets/hosts/<hostname>.yaml
#
# Add a matching creation_rule to .sops.yaml for the new host.

# Login password hash (required on immutable-user hosts like impermanent servers)
<username>_password_hash: "$y$j9T$..."

