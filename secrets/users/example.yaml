# Example user secrets file for sops-menu (unencrypted reference).
# Copy this to <username>.yaml and encrypt with:
#   sops secrets/users/<username>.yaml
#
# Add a matching creation_rule to .sops.yaml for the new user.
# Declare a sops-nix secret on hosts that should use sops-menu with:
#   sops.secrets.<username>_user_secrets = {
#     sopsFile = ../../../secrets/users/<username>.yaml;
#     owner = "<username>";
#   };
# Then point Home Manager at `config.sops.secrets.<username>_user_secrets.path`.

entries:
  - name: "Example Service"
    username: "user@example.com"
    password: "changeme"
    url: "https://example.com"
    notes: "Example entry -- delete this"
    # otp: "JBSWY3DPEHPK3PXP"

  - name: "Another Service"
    username: "admin"
    password: "changeme"
    url: "https://another.example.com"
    notes: ""
